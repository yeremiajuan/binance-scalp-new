[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbot"
version = "0.2.0"
description = "PAPER-only Binance spot BTCUSDT paper bot: offline synthetic core (Phase 1) and a public-market-data forward runner (Phase 2). No live trading."
requires-python = ">=3.12"
dependencies = [
    "websockets>=13,<16",  # public market streams (sync client); the only runtime dependency
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6", "build>=1"]

[project.scripts]
paperbot = "paperbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
